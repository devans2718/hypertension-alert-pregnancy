[project]
name = "htn-alert"
version = "0.1.0"
description = "Hack-A-Roo Fall 2026 prototype: severe-hypertension alerting for labor and delivery, on synthetic data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htn_alert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
