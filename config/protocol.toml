# Clinical and timing values for the episode logic.
#
# Every value names its source:
#   Lit     published literature (cited)
#   Pitch   the pitch team's description of their unit
#   Assume  our assumption, to vary in sensitivity analysis
#
# Until the pitch team confirms a value, treat it as an assumption.
# Ask the team before changing a value here (see AGENTS.md).
#
# "SMFM" below: Combs CA et al., Society for Maternal-Fetal Medicine Special
# Statement: A quality metric for evaluating timely treatment of severe
# hypertension. Am J Obstet Gynecol 2022;226(2):B2-B9.
# "Onset" is an episode's first severe reading.

[severe]
# Severe range: systolic >= 160 OR diastolic >= 110 mmHg.
# Lit: SMFM, Table 1.
systolic = 160
diastolic = 110

[repeat]
# An episode ends at the first reading below the severe range. It's persistent
# if either condition below holds.
# Persistent if not documented below severe within this long of onset, so a
# missing recheck counts as persistent.
# Lit: SMFM, Table 1. Assume: 15 itself counts as within. Pitch: to confirm.
min_minutes = 15
# Persistent if severe again from min_minutes through this long after onset, even
# with non-severe readings in between. Such a reading folds back into the episode.
# Lit: SMFM, Table 1 and Figure 1. Assume: both ends inclusive. Pitch: to confirm.
max_minutes = 60

[treatment]
# Time-to-treatment target, counted from onset, not from confirmation.
# Timely means a standard antihypertensive within this long of onset, or a
# non-severe reading within this long with no severe reading after it in that hour.
# Lit: SMFM, Table 1. Pitch: 60-minute national standard; clock start confirmed
# 2026-10-28.
target_minutes = 60

[escalation]
# Escalate when the provider hasn't acknowledged within this long of notification.
# Notification is the CONFIRMED event. Exactly this long doesn't escalate.
# Assume: no source yet.
# Placeholder, for the team to decide: a late confirmation gets the same timeout.
# Severe at 0, non-severe at 15 and severe at 50 confirms at 50 and escalates just
# after 60, when the treatment window has closed. See _should_escalate in episodes.py.
unacknowledged_minutes = 10
